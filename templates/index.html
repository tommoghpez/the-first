<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>視聴管理 - 日本M&Aセンター YouTube</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; }
    h1 { margin: 0 0 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card { border: 1px solid #ddd; border-radius: 12px; overflow: hidden; background: #fff; }
    .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display:block; }
    .body { padding: 12px; }
    .title { font-size: 16px; margin: 0 0 8px; line-height: 1.4; }
    .meta { color: #666; font-size: 12px; }
    .actions { margin-top: 10px; }
    .btn { display:inline-block; padding:8px 10px; border-radius:8px; border:1px solid #ccc; text-decoration:none; }
  </style>
</head>
<body>
  <h1>日本M&Aセンター 公式YouTube — 視聴管理（一覧）</h1>
  <div class="grid">
    {% for v in videos %}
      <div class="card">
        <a href="{{ v.url }}" target="_blank" rel="noopener">
          <img class="thumb" src="{{ v.thumb }}" alt="">
        </a>
        <div class="body">
          <h3 class="title">{{ v.title }}</h3>
          <div class="meta">追加日時: {{ v.added_at }}</div>
          <div class="actions">
            <!-- 次のステップで「視聴済みにする」ボタンを実装 -->
            <a class="btn" href="{{ v.url }}" target="_blank" rel="noopener">再生</a>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
</body>
</html>
