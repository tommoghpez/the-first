name: Fetch YouTube Videos

on:
  schedule:
    # 毎日 06:00 JST（=前日 21:00 UTC）
    - cron: '0 21 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # 期限切れガード（2026-10-01 以降は以降の処理をスキップ）
      - name: Stop after 2026-10-01
        run: |
          TODAY=$(date -u +%F)
          if [[ "$TODAY" > "2026-10-01" || "$TODAY" == "2026-10-01" ]]; then
            echo "Workflow expired on 2026-10-01. Please update if you want to continue."
            echo "STOP=true" >> $GITHUB_ENV
          fi

      - name: Checkout
        if: env.STOP != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.STOP != 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: env.STOP != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run fetch script
        if: env.STOP != 'true'
        run: |
          python3 scripts/fetch_videos.py

      - name: Commit and push if changed
        if: env.STOP != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update videos.csv"
            git push
          else
            echo "No changes to commit."
          fi